services:
  - type: web
    name: solar-platform-v2
    runtime: node
    plan: free
    region: oregon
    branch: r7.1-issue-11
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solar-platform-v2-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: SESSION_SECRET
        generateValue: true
      - key: R7_SEED_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: 12
      - key: AUTH_RATE_LIMIT
        value: 20
      - key: API_RATE_LIMIT
        value: 2000
      - key: CLIENT_MIN_VERSION
        value: 0.7.1
      - key: API_COMPATIBILITY
        value: 7.1

databases:
  - name: solar-platform-v2-db
    databaseName: solar_platform_v2
    user: solar_platform_v2
    plan: free
    region: oregon
