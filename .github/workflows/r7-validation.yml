name: R7 validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solar
          POSTGRES_PASSWORD: solar_ci
          POSTGRES_DB: solar_platform_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solar -d solar_platform_v2"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://solar:solar_ci@127.0.0.1:5432/solar_platform_v2
      SESSION_SECRET: r7-ci-session-secret-${{ github.run_id }}-solar-platform
      APP_ORIGIN: http://127.0.0.1:4173
      PORT: 8787
      VITE_API_URL: http://127.0.0.1:8787
      R7_SEED_PASSWORD: r7-ci-${{ github.run_id }}-validation-password
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official logo payload
        shell: bash
        run: |
          set -euo pipefail
          logo="src/assets/branding/buenos-dias-sol-by-enertika.png"
          echo "source: $(file "$logo")"
          echo "source-size: $(wc -c < "$logo")"
          echo "source-sha: $(sha256sum "$logo" | awk '{print $1}')"
          base64 -d "$logo" > /tmp/logo.decoded
          echo "decoded: $(file /tmp/logo.decoded)"
          echo "decoded-size: $(wc -c < /tmp/logo.decoded)"
          echo "decoded-sha: $(sha256sum /tmp/logo.decoded | awk '{print $1}')"
          echo -n "decoded-head: "; xxd -p -l 32 /tmp/logo.decoded
          exit 1
