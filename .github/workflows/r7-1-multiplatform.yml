name: R7.1 multiplatform
on:
  push:
    branches: [r7.1-issue-11]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: solar, POSTGRES_PASSWORD: solar_ci, POSTGRES_DB: solar_platform_v2}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solar -d solar_platform_v2" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://solar:solar_ci@127.0.0.1:5432/solar_platform_v2
      SESSION_SECRET: r71-ci-session-secret-${{ github.run_id }}-solar-platform
      APP_ORIGIN: http://127.0.0.1:4173
      PORT: 8787
      VITE_API_URL: http://127.0.0.1:8787
      R7_SEED_PASSWORD: r71-ci-${{ github.run_id }}-validation-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/generate-r7-1-icons.mjs
      - run: cp src-tauri/icons/192x192.png public/pwa-192x192.png && cp src-tauri/icons/512x512.png public/pwa-512x512.png
      - run: npm run db:migrate && npm run db:seed && npm test && npm run db:validate && npm run build
      - run: test -z "$(grep -R -E 'DATABASE_URL|SESSION_SECRET|R7_SEED_PASSWORD' dist 2>/dev/null || true)"
      - run: npm run validate:r7-1
      - run: npx playwright install --with-deps chromium
      - run: npm run preview -- --host 127.0.0.1 > /tmp/r71-vite.log 2>&1 & npx wait-on http://127.0.0.1:4173 && node scripts/capture-r7-1.mjs
      - uses: actions/upload-artifact@v4
        with: {name: r7-1-responsive-evidence, path: artifacts/r7.1}
      - run: find artifacts/r7.1 -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/r7.1/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: r7-1-responsive-evidence-checksums, path: artifacts/r7.1/SHA256SUMS.txt}
      - uses: actions/upload-artifact@v4
        with: {name: web-dist, path: dist}
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install
      - run: node scripts/generate-r7-1-icons.mjs
      - run: cp src-tauri/icons/192x192.png public/pwa-192x192.png && cp src-tauri/icons/512x512.png public/pwa-512x512.png
      - run: npm run build:web
      - run: npx cap add android && npx cap sync android
      - run: cd android && ./gradlew assembleDebug bundleRelease
      - run: test -s android/app/build/outputs/apk/debug/app-debug.apk && test -s android/app/build/outputs/bundle/release/app-release.aab
      - run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/bundle/release/app-release.aab > android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: android-builds, path: |
            android/app/build/outputs/**
            android/SHA256SUMS.txt}
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: node scripts/generate-r7-1-icons.mjs
      - run: cp src-tauri/icons/192x192.png public/pwa-192x192.png && cp src-tauri/icons/512x512.png public/pwa-512x512.png
      - run: npm run build:web
      - run: npx cap add ios && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Validate iPhone and iPad simulator runtime
        shell: bash
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/App.app' -print -quit)"
          test -d "$APP_PATH"
          mkdir -p artifacts/r7.1/native-ios
          python3 - <<'PY' > /tmp/r71-simulators.txt
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[d for group in data['devices'].values() for d in group]
          iphone=next(d for d in devices if 'iPhone' in d['name'])
          ipad=next(d for d in devices if 'iPad' in d['name'])
          print(iphone['udid']); print(ipad['udid'])
          PY
          IPHONE="$(sed -n '1p' /tmp/r71-simulators.txt)"
          IPAD="$(sed -n '2p' /tmp/r71-simulators.txt)"
          for SPEC in "iphone:$IPHONE" "ipad:$IPAD"; do
            KIND="${SPEC%%:*}"; UDID="${SPEC#*:}"
            xcrun simctl boot "$UDID" || true
            open -a Simulator --args -CurrentDeviceUDID "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP_PATH"
            xcrun simctl launch "$UDID" mx.enertika.buenosdiassol
            sleep 5
            xcrun simctl io "$UDID" screenshot "artifacts/r7.1/native-ios/ios-${KIND}.png"
            xcrun simctl shutdown "$UDID" || true
          done
          shasum -a 256 artifacts/r7.1/native-ios/*.png > artifacts/r7.1/native-ios/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
            artifacts/r7.1/native-ios/**
  desktop:
    strategy:
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: node scripts/generate-r7-1-icons.mjs
      - run: cp src-tauri/icons/192x192.png public/pwa-192x192.png && cp src-tauri/icons/512x512.png public/pwa-512x512.png
      - run: npm run tauri icon src-tauri/icons/512x512.png
      - uses: tauri-apps/tauri-action@v0
        env:
          VITE_API_URL: https://staging.invalid.example
      - name: Verify desktop distributables
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            find src-tauri/target/release/bundle -type f -name '*.msi' | grep -q .
            find src-tauri/target/release/bundle -type f -name '*setup.exe' | grep -q .
          else
            find src-tauri/target/release/bundle -type f -name '*.dmg' | grep -q .
            find src-tauri/target/release/bundle -type d -name '*.app' | grep -q .
          fi
      - name: Capture Windows runtime evidence
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/r7.1/native-windows | Out-Null
          $exe = Resolve-Path "src-tauri/target/release/buenos-dias-sol.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save((Join-Path $PWD "artifacts/r7.1/native-windows/windows-app.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-FileHash artifacts/r7.1/native-windows/windows-app.png -Algorithm SHA256 | Format-List | Out-File artifacts/r7.1/native-windows/SHA256SUMS.txt
      - name: Capture macOS runtime evidence
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          mkdir -p artifacts/r7.1/native-macos
          APP_PATH="$(find src-tauri/target/release/bundle -type d -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          open "$APP_PATH"
          sleep 8
          screencapture -x artifacts/r7.1/native-macos/macos-app.png
          test -s artifacts/r7.1/native-macos/macos-app.png
          shasum -a 256 artifacts/r7.1/native-macos/macos-app.png > artifacts/r7.1/native-macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            artifacts/r7.1/native-*/**
