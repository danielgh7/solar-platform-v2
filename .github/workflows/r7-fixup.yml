name: R7 deterministic fixup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fixup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Finalize strict branding/PDF browser evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-r7.mjs'); s=p.read_text()
          anchor="const me=await page.evaluate(async api=>await(await fetch(`${api}/api/auth/me`,{credentials:'include'})).json(),api);assert(me.role==='Admin'&&me.organizationSlug==='buenos-dias-sol','real session/tenant context missing');const orgId=me.organizationId;"
          addition="""const logo=page.locator('.r7-brand-logo').first();await logo.waitFor({state:'visible'});const logoMetrics=await logo.evaluate(img=>({naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,width:img.getBoundingClientRect().width,height:img.getBoundingClientRect().height}));assert(logoMetrics.naturalWidth===2048&&logoMetrics.naturalHeight===682,'official logo intrinsic dimensions invalid');assert(Math.abs((logoMetrics.width/logoMetrics.height)-(2048/682))<0.01,'official logo rendered with distorted aspect ratio');const logoBinary=await page.evaluate(async({api,orgId})=>{const b=await(await fetch(`${api}/api/orgs/${orgId}/branding`,{credentials:'include'})).json();const r=await fetch(`${api}/api/orgs/${orgId}/assets/${b.logoAssetId}`,{credentials:'include'});const a=await r.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',a);return{size:a.byteLength,sha:[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}} ,{api,orgId});assert(logoBinary.size===254968&&logoBinary.sha==='92af3125cc33715e57c5f6129ae026eb9cf9ca9c75962ea5b3907fb0b74c10d5','server-backed official logo bytes/hash invalid');"""
          if 'logoMetrics=await logo.evaluate' not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+addition)
          p.write_text(s)

          p=Path('scripts/capture-r7.mjs'); s=p.read_text()
          s=s.replace("await page.waitForSelector('[data-testid=\"r7-projects\"]');await page.screenshot", "await page.locator('[data-testid=\"r7-projects\"]').getByText(PROJECT,{exact:false}).waitFor({state:'visible'});await page.screenshot")
          s=s.replace("await page.getByLabel('Idioma').selectOption('en-US');await page.waitForTimeout(100);await page.screenshot", "await page.getByLabel('Idioma').selectOption('en-US');await page.locator('.topnav').getByText('Projects',{exact:true}).waitFor({state:'visible'});await page.screenshot")
          s=s.replace("await page.getByLabel('Idioma').selectOption('es-MX');await page.waitForTimeout(100);await page.goto", "await page.getByLabel('Idioma').selectOption('es-MX');await page.locator('.topnav').getByText('Proyectos',{exact:true}).waitFor({state:'visible'});await page.goto")
          s=s.replace("await page.getByRole('button',{name:'Guardar cambios'}).click();await page.waitForTimeout(120);await page.screenshot", "await page.getByRole('button',{name:'Guardar cambios'}).click();await page.locator('.r7-save-state[data-state=\"conflict\"]').waitFor({state:'visible'});await page.screenshot")
          s=s.replace("const pdfPath='/tmp/r7-proposal.pdf';await download.saveAs(pdfPath);", "const pdfDir='artifacts/pdf/r7';await fs.mkdir(pdfDir,{recursive:true});const pdfPath=`${pdfDir}/proposal-residencia-montebello-r7.pdf`;await download.saveAs(pdfPath);")
          old="const data=new Uint8Array(await fs.readFile(pdfPath)),pdf=await pdfjs.getDocument({data}).promise,p1=await pdf.getPage(1),viewport=p1.getViewport({scale:1.75})"
          new="const data=new Uint8Array(await fs.readFile(pdfPath)),pdf=await pdfjs.getDocument({data}).promise,p1=await pdf.getPage(1),text=await p1.getTextContent(),pdfText=text.items.map(x=>('str' in x?x.str:'')).join(' ');assert(pdfText.includes('Buenos días sol by Enertika')&&pdfText.includes('Energía que conecta.'),'real PDF missing official organization branding');const viewport=p1.getViewport({scale:1.75})"
          if old in s: s=s.replace(old,new)
          s=s.replace("await browser.close();console.log('Captured 13 R7 final states", "const shots=(await fs.readdir(out)).filter(x=>x.endsWith('.png'));if(shots.length!==13)throw new Error(`Expected 13 R7 screenshots, found ${shots.length}`);await browser.close();console.log('Captured 13 R7 final states")
          assert 'waitForTimeout' not in s
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-r7.mjs scripts/capture-r7.mjs
          git diff --cached --quiet || git commit -m "test(r7): verify exact UI logo and real branded PDF"
          git push
