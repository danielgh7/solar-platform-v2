name: R4 validation
on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/screenshots/r4/**'
  workflow_dispatch:
concurrency:
  group: r4-validation-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test R1 + R2 + R3 + R4 deterministic logic
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Launch preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/r4-vite.log 2>&1 &
          npx wait-on http://127.0.0.1:4173
      - name: Browser R4 validation
        run: npm run validate:r4
      - name: Capture R4 states
        run: npm run capture:r4
      - name: Commit R4 screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/screenshots/r4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add R4 validation screenshots [skip ci]"
          git pull --rebase origin main
          git push
